<!DOCTYPE html>
<html>
    <head>
         <meta charset = "UTF-8">
   <meta name ="viewport"
   content="width=device-width, initial-scale =1.0" >
        <title>Login for better offers</title>
        <style>
            body,html{
                margin: 0;
                padding:0;
            }
            header {
                
                text-align:center;
                font-size:24px;
                font-weight: bold;
                background-color: #6d99f1;
                color: #ffffff;
                padding:5px;
            }
            body {
                text-align: center;
                font-family: Arial, sans-serif;
                font-size:16px;
                background-color:#ffffff;
            }
            input {
                padding: 10px;
                margin: 5px 0;
                width: 200px;
            }
            #login-box{
                    display:flex;
           flex-direction:column;
           justify-content: center;
           align-items: flex-start;
             gap:10px;
             background:#cccccc;
             color: #000000;
            padding:20px;
            width:260px;
            margin:10px auto;
           border-radius:8px;
            }
            button {
                padding: 10px 20px;
                background-color: #86ff6b;
                color: rgb(19, 11, 15);
                border: none;
                cursor: pointer;
            }
            button:hover {
                background-color: #4fe929;
            }
            @media (max-width:900px){
                header{
                    font-size: 20px;
                    font-weight: bold;
                }
            }
            </style>
    </head>
<body>
    <header>
        <p>Login for better offers</p>
    </header>


<h4>Welcome back Reader!</h4>
<div id="login-box">
    <label>Enter Username:</label>
<input type="text" id="username" placeholder="Enter username">
   <label >Enter Password:</label>
<input type="password" id="password" placeholder="Enter password">


<button id="login-btn">Login</button>
</div>
<p id="msg"></p>
<p>
  New user?
  <a href="register.html">Signup</a>
</p>
<script src="login.js"></script>
</body>
</html>

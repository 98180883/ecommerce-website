<!DOCTYPE html>
<html>
    <head>
        
        <title>Register Page</title>
        <style>
            body {
                text-align:center;
                font-family: Arial, sans-serif;
                margin: 20px;
                font-size:20px;
                background-color:#ffffff;
            }
            input {
                padding: 10px;
                margin: 5px 0;
                width: 200px;
            }
            button {
                padding: 10px 20px;
                background-color: #4cd21c;
                color: rgb(19, 11, 15);
                border: none;
                cursor: pointer;
            }
            button:hover {
                background-color: #4fe929;
            }
            </style>
    </head>
<body>
<p>
  Already have an account?
  <a href="login.html">Login</a>
</p>

<h2>Create Your Account To Enjoy A New World Of E-Books</h2>
<input type="email" id="email" placeholder="Enter email">
<br><br>
<input type="text" id="newUser" placeholder="Create username">
<br><br>
<input type="password" id="newPass" placeholder="Create password">
<br><br>
<input type="password" id="confirmPass" placeholder="Confirm password">
<br><br>
<button id="Register-btn">Register</button>

<p id="msg"></p>

<script src="register.js"></script>
</body>
</html>

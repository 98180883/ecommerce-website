<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
   <meta name ="viewport"
   content="width=device-width, initial-scale =1.0" > 
        <title>Order Confirmation</title>
    <link rel="stylesheet" href="order-confirm.css">
    </head>
    
<body>
    <header>
        <img src="success.png" alt="success" />
Order Successful!
<p id="thanks">Thank you Shopping With Us</p>
    </header>
<main>
    <section class="order-container">

    <p class="section-header">Invoice details</p>
<div class="order-details">
<p id="order-id"></p>
<p id="order-qty"></p>
<p id="sub-total"></p>
<p id="discount">Discount:   ₹0</p>
</div>

<p id="total"></p>

<p class="section-header">Billing details</p>
<div class="customer-details">
<p id="name"></p>
<p id="email"></p>
<p id="ph"></p>
<p id="adress"></p>
<p id="payment-mode">Mode of Payment:   COD</p>
</div>
</section>
<div class="feedback">
<p class="section-header"> Customer Feedback Form </p>
<form id="feedback">
    <h3>Please share your thoughts about your shopping experience</h3>
<input type="text" id ="enjoyed" placeholder="What You enjoyed">
<input type="text" id="expected" placeholder="What You expected">
<input type="text" id="feed" placeholder="Your Feedback" required>    
<button type="submit" id="feedBtn">Submit Feedback</button>
</form>

</div>

<p><b>Continue Shopping <a href="index.html">Here</a></b></p>

</main>
<footer>
<p>&copy; 2026 Digital Store. All rights reserved.</p>
</footer>


<script src="cart-validation.js"></script>
<script src="order-confirm.js"></script>
</body>
</html>
